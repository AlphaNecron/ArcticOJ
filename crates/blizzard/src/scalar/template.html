<!doctype html>
<html>
<head>
    <title>ArcticOJ API reference</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>:root { --scalar-font: 'Space Grotesk', sans-serif; --scalar-font-code: 'Space Mono', monospace; }</style>
</head>
<body>
<main></main>
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
<script>
    Scalar.createApiReference('main', {
        url: '/openapi.json',
        defaultHttpClient: {
            targetKey: 'node',
            clientKey: 'fetch'
        },
        telemetry: false,
        theme: 'bluePlanet',
        withDefaultFonts: false
    });
</script>
</body>
</html>

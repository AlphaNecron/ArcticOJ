[package]
name = "blizzard"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true
opt-level = "s"
lto = true

[features]
default = ["debug"]
debug = ["sea-orm/debug-print", "sea-orm/schema-sync", "sea-orm/entity-registry"]

[dependencies]
poem = { version = "3.1.12", features = ["multipart", "sse", "tower", "requestid", "session"] }
poem-grants = { version = "3.0.2", features = ["protect-endpoints-proc-macro"] }
poem-openapi = { version = "5.1.16", features = ["chrono", "email"] }
sea-orm.workspace = true
argon2 = { version = "0.6.0-rc", default-features = false, features = ["parallel", "getrandom", "password-hash", "std"] }
pasetors = "0.7.7"
cuid2 = "0.1.4"
serde.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
poem-extensions = "0.9.0"
migration.workspace = true
thiserror = "2.0.17"
serde_json = "1.0.145"
miette.workspace = true
config.workspace = true
knus.workspace = true